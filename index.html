<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ernest Hemingway · FPL dres</title>
<link rel="icon" type="image/png" href="grb-mali.png">
<meta name="description" content="Ko vodi u borbi za dres: bodovi po blokovima od 6 kola.">
<style>
  :root {
    --bg: #100a1c;
    --povrsina: #1a1230;
    --povrsina-2: #241a40;
    --linija: #33275a;
    --tekst: #f4f1fb;
    --tekst-2: #b3a9cf;
    --zelena: #00ff85;
    --roze: #ff2d78;
    --zlatna: #ffd24a;
    --radijus: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 500px at 10% -10%, #2a0f55 0%, transparent 60%), var(--bg);
    color: var(--tekst);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
  }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }

  header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .grb { height: 64px; width: auto; flex: none; display: block; }
  h1 { margin: 0; font-size: 1.6rem; line-height: 1.15; letter-spacing: -0.02em; }
  .podnaslov { margin: 2px 0 0; color: var(--tekst-2); font-size: 0.9rem; }

  .traka-demo {
    background: #3b2a00; border: 1px solid var(--zlatna); color: var(--zlatna);
    padding: 10px 14px; border-radius: 10px; margin-bottom: 18px; font-size: 0.92rem;
  }
  .poruka { background: var(--povrsina); border: 1px solid var(--linija); padding: 18px; border-radius: var(--radijus); }

  section { margin-top: 28px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--tekst-2); font-weight: 650; }

  .kartica {
    background: linear-gradient(180deg, var(--povrsina-2), var(--povrsina));
    border: 1px solid var(--linija); border-radius: var(--radijus); padding: 18px;
  }
  .glava-bloka { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: baseline; }
  .glava-bloka h3 { margin: 0; font-size: 1.3rem; }
  .glava-bloka .kola { color: var(--tekst-2); }
  .preostalo { color: var(--zelena); font-weight: 650; }

  .tackice { display: flex; gap: 6px; margin: 14px 0 6px; }
  .tackica {
    flex: 1; height: 8px; border-radius: 99px; background: var(--linija);
  }
  .tackica.gotovo { background: var(--zelena); }
  .oznake-kola { display: flex; gap: 6px; color: var(--tekst-2); font-size: 0.75rem; margin-bottom: 14px; }
  .oznake-kola span { flex: 1; text-align: center; }

  .lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .red {
    display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
    padding: 10px 12px; border-radius: 10px; background: rgba(255,255,255,0.03);
    position: relative; overflow: hidden;
  }
  .red .traka {
    position: absolute; inset: 0 auto 0 0; background: rgba(0,255,133,0.10);
    width: var(--sirina, 0%); transition: width .6s ease;
  }
  .red > * { position: relative; }
  .red.vodi { outline: 1px solid var(--zelena); background: rgba(0,255,133,0.06); }
  .mesto { font-weight: 700; color: var(--tekst-2); text-align: center; }
  .vodi .mesto { color: var(--zelena); }
  .ime { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tim { display: block; color: var(--tekst-2); font-size: 0.8rem; font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
  .bodovi { text-align: right; font-weight: 750; font-size: 1.15rem; }
  .razlika { display: block; font-size: 0.75rem; font-weight: 500; color: var(--tekst-2); }
  .znak-dres { width: 18px; height: 18px; vertical-align: -3px; margin-left: 6px; color: var(--zelena); }

  .dresovi { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .dres {
    background: var(--povrsina); border: 1px solid var(--linija); border-radius: var(--radijus); padding: 14px;
  }
  .dres .oznaka { color: var(--tekst-2); font-size: 0.85rem; display: flex; justify-content: space-between; gap: 8px; }
  .dres .kome { margin-top: 8px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .dres .kome svg { width: 22px; height: 22px; flex: none; color: var(--zlatna); }
  .dres .pts { color: var(--tekst-2); font-size: 0.9rem; margin-top: 2px; }
  .dres.nereseno .kome svg { color: var(--roze); }
  .dres.nereseno .kome { color: var(--roze); }
  .dres.uskoro { opacity: .5; border-style: dashed; }
  .dres.uskoro .kome svg { color: var(--tekst-2); }
  .dres.uskoro .kome { color: var(--tekst-2); font-weight: 600; }

  .rekapitulacija { margin-top: 12px; color: var(--tekst-2); font-size: 0.92rem; }
  .rekapitulacija b { color: var(--tekst); }

  .tabela-okvir {
    overflow-x: auto; border: 1px solid var(--linija); border-radius: var(--radijus);
    background: var(--povrsina); -webkit-overflow-scrolling: touch;
  }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 0.9rem; }
  th, td { padding: 8px 10px; text-align: center; white-space: nowrap; border-bottom: 1px solid var(--linija); }
  thead th { color: var(--tekst-2); font-weight: 600; background: var(--povrsina-2); position: sticky; top: 0; }
  tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
  th.igrac, td.igrac {
    position: sticky; left: 0; text-align: left; background: var(--povrsina-2); z-index: 1;
    max-width: 150px; overflow: hidden; text-overflow: ellipsis; border-right: 1px solid var(--linija);
  }
  td.igrac { font-weight: 600; }
  td.najbolje { color: var(--zelena); font-weight: 750; }
  td.nista { color: var(--linija); }
  th.zbir, td.zbir { background: rgba(255,255,255,0.04); font-weight: 750; border-left: 1px solid var(--linija); border-right: 1px solid var(--linija); }
  td.zbir.pobednik { color: var(--zlatna); }
  td.ukupno { font-weight: 750; }
  .minus { color: var(--roze); font-size: 0.7rem; vertical-align: super; margin-left: 2px; }
  .beleska { margin-top: 8px; color: var(--tekst-2); font-size: 0.8rem; }

  .pravila { color: var(--tekst-2); font-size: 0.9rem; }
  .pravila ul { margin: 0; padding-left: 20px; }
  .pravila li { margin: 4px 0; }

  footer { margin-top: 32px; color: var(--tekst-2); font-size: 0.8rem; text-align: center; }

  @media (min-width: 640px) {
    main { padding-top: 40px; }
    .grb { height: 76px; }
    h1 { font-size: 2rem; }
    .kartica { padding: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { .red .traka { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <img class="grb" src="grb-mali.png" alt="Grb Kragujevca">
    <div>
      <h1 id="naslov">Ernest Hemingway</h1>
      <p class="podnaslov" id="podnaslov">Učitavam podatke…</p>
    </div>
  </header>
  <div id="sadrzaj"></div>
  <footer id="podnozje"></footer>
</main>

<script type="module">
import { izracunaj } from "./logika.js";

const DRES_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.5 3 3 5.5l1.7 4.2L7 8.8V21h10V8.8l2.3.9L21 5.5 15.5 3c-.4 1.3-1.9 2.2-3.5 2.2S8.9 4.3 8.5 3Z"/></svg>';

const koren = document.getElementById("sadrzaj");

function el(tag, svojstva = {}, deca = []) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(svojstva)) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "style") n.setAttribute("style", v);
    else n.setAttribute(k, v);
  }
  for (const d of [].concat(deca)) if (d) n.append(d);
  return n;
}
function dresIkona(klasa = "") {
  const s = document.createElement("span");
  s.innerHTML = DRES_SVG; // konstanta, bez korisničkog teksta
  const svg = s.firstChild;
  if (klasa) svg.setAttribute("class", klasa);
  return svg;
}

function formatirajDatum(iso) {
  const d = new Date(iso);
  const delovi = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/Belgrade", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false,
  }).formatToParts(d).reduce((o, p) => ((o[p.type] = p.value), o), {});
  return `${delovi.day}.${delovi.month}.${delovi.year}. u ${delovi.hour}:${delovi.minute}`;
}

function ostaloTekst(n) {
  if (n === 0) return "blok je završen";
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return `ostalo ${n} kolo`;
  return `ostalo ${n} kola`;
}

function prikaziGresku(poruka) {
  document.getElementById("podnaslov").textContent = "";
  koren.replaceChildren(el("div", { class: "poruka", text: poruka }));
}

function kartaTrenutnogBloka(b) {
  const karta = el("div", { class: "kartica" });
  const brojKola = b.kola.length;

  karta.append(
    el("div", { class: "glava-bloka" }, [
      el("h3", { text: `Blok ${b.broj}` }),
      el("span", { class: "kola", text: `kola ${b.od}–${b.do}` }),
      el("span", { class: "preostalo", text: `${b.zavrsenaKola.length} od ${brojKola} završeno, ${ostaloTekst(b.preostalo)}` }),
    ])
  );

  const tackice = el("div", { class: "tackice", role: "img", "aria-label": `${b.zavrsenaKola.length} od ${brojKola} kola završeno` });
  const oznake = el("div", { class: "oznake-kola" });
  for (const k of b.kola) {
    tackice.append(el("div", { class: "tackica" + (b.zavrsenaKola.includes(k) ? " gotovo" : "") }));
    oznake.append(el("span", { text: String(k) }));
  }
  karta.append(tackice, oznake);

  if (b.zavrsenaKola.length === 0) {
    karta.append(el("p", { class: "podnaslov", text: "Prvo kolo ovog bloka još nije završeno. Čim se završi, ovde se pojavljuje poredak." }));
    return karta;
  }

  const lista = el("ol", { class: "lista" });
  const vodjaPoeni = b.najvise;
  for (const r of b.redovi) {
    const vodi = r.bodovi === vodjaPoeni;
    const razlika = vodjaPoeni - r.bodovi;
    const procenat = vodjaPoeni > 0 ? Math.max(0, (r.bodovi / vodjaPoeni) * 100) : 0;
    const ime = el("div", { class: "ime" }, [
      document.createTextNode(r.igrac.ime),
      vodi ? dresIkona("znak-dres") : null,
      el("span", { class: "tim", text: r.igrac.tim }),
    ]);
    const bod = el("div", { class: "bodovi" }, [
      document.createTextNode(String(r.bodovi)),
      el("span", { class: "razlika", text: vodi ? "vodi" : `−${razlika}` }),
    ]);
    lista.append(
      el("li", { class: "red" + (vodi ? " vodi" : "") }, [
        el("span", { class: "traka", style: `--sirina:${procenat.toFixed(1)}%` }),
        el("span", { class: "mesto", text: String(r.mesto) }),
        ime,
        bod,
      ])
    );
  }
  karta.append(lista);
  return karta;
}

function dresKartica(b, nagrada) {
  const naslov = el("div", { class: "oznaka" }, [
    el("span", { text: `Blok ${b.broj}` }),
    el("span", { text: `kola ${b.od}–${b.do}` }),
  ]);
  if (b.status === "zavrsen" && b.pobednik) {
    const pobednikRed = b.redovi.find((r) => r.igrac.id === b.pobednik.id);
    return el("div", { class: "dres" }, [
      naslov,
      el("div", { class: "kome" }, [dresIkona(), document.createTextNode(b.pobednik.ime)]),
      el("div", { class: "pts", text: `${pobednikRed.bodovi} bodova` }),
    ]);
  }
  if (b.izjednaceno) {
    return el("div", { class: "dres nereseno" }, [
      naslov,
      el("div", { class: "kome" }, [dresIkona(), document.createTextNode("Izjednačeno")]),
      el("div", { class: "pts", text: `${b.lideri.map((l) => l.ime).join(", ")} (${b.najvise} bodova). Dogovor.` }),
    ]);
  }
  return el("div", { class: "dres uskoro" }, [
    naslov,
    el("div", { class: "kome" }, [dresIkona(), document.createTextNode(b.status === "u_toku" ? "U toku" : "Uskoro")]),
  ]);
}

function tabelaPoKolima(data, izracun) {
  const zavrsena = new Set(data.zavrsenaKola);
  // Prikazujemo blokove do trenutnog (uključujući njega)
  const trenutniBroj = izracun.trenutni ? izracun.trenutni.broj : izracun.blokovi.length;
  const prikazani = izracun.blokovi.filter((b) => b.broj <= trenutniBroj);

  // najbolji rezultat u svakom kolu
  const najboljeUKolu = {};
  for (const k of data.zavrsenaKola) {
    najboljeUKolu[k] = Math.max(...data.igraci.map((i) => i.kola[k]?.bodovi ?? -Infinity));
  }

  const thead = el("tr");
  thead.append(el("th", { class: "igrac", scope: "col", text: "Igrač" }));
  for (const b of prikazani) {
    for (const k of b.kola) thead.append(el("th", { scope: "col", text: String(k) }));
    thead.append(el("th", { class: "zbir", scope: "col", text: `Blok ${b.broj}` }));
  }
  thead.append(el("th", { scope: "col", text: "Ukupno" }));

  // Redosled redova: po ukupnom broju bodova u sezoni
  const ukupnoIgraca = (ig) => data.zavrsenaKola.reduce((s, k) => s + (ig.kola[k]?.bodovi ?? 0), 0);
  const redosled = [...data.igraci].sort((a, b) => ukupnoIgraca(b) - ukupnoIgraca(a) || a.ime.localeCompare(b.ime, "sr"));

  const tbody = el("tbody");
  for (const ig of redosled) {
    const tr = el("tr");
    tr.append(el("th", { class: "igrac", scope: "row", text: ig.ime, title: ig.tim }));
    for (const b of prikazani) {
      for (const k of b.kola) {
        const podatak = ig.kola[k];
        if (!zavrsena.has(k) || !podatak) {
          tr.append(el("td", { class: "nista", text: "·" }));
          continue;
        }
        const td = el("td", { class: podatak.bodovi === najboljeUKolu[k] ? "najbolje" : "", text: String(podatak.bodovi) });
        if (podatak.minus > 0) td.append(el("span", { class: "minus", title: "minus za transfere", text: `−${podatak.minus}` }));
        tr.append(td);
      }
      const red = b.redovi.find((r) => r.igrac.id === ig.id);
      const jePobednik = b.status === "zavrsen" && b.lideri.some((l) => l.id === ig.id);
      tr.append(el("td", { class: "zbir" + (jePobednik ? " pobednik" : ""), text: b.zavrsenaKola.length ? String(red.bodovi) : "·" }));
    }
    tr.append(el("td", { class: "ukupno", text: String(ukupnoIgraca(ig)) }));
    tbody.append(tr);
  }

  return el("div", { class: "tabela-okvir" }, [
    el("table", {}, [el("thead", {}, [thead]), tbody]),
  ]);
}

function pravila(data) {
  const p = data.podesavanja;
  const nagrada = p.nagrada || "Dres";
  const stavke = [
    `Na svakih ${p.velicinaBloka} završenih kola, ${nagrada.toLowerCase()} osvaja onaj sa najviše bodova u tom bloku.`,
    "Računaju se zvanični bodovi sa FPL-a, sa minusima za transfere.",
    "Kolo se računa tek kad ga FPL označi kao završeno.",
    "Ako dvojica imaju isti broj bodova u bloku, dogovorite se.",
  ];
  if (p.poslednjiBlok === "spojen") stavke.push(`Poslednja kola sezone se spajaju sa prethodnim blokom.`);
  if (p.poslednjiBlok === "kraci") stavke.push(`Poslednja kola sezone čine kraći blok.`);
  if (p.poslednjiBlok === "nema") stavke.push(`Poslednja kola koja ne popune blok ne donose ${nagrada.toLowerCase()}.`);
  return el("div", { class: "kartica pravila" }, [el("ul", {}, stavke.map((t) => el("li", { text: t })))]);
}

function nacrtaj(data) {
  const naziv = data.liga?.naziv || "FPL liga";
  document.getElementById("naslov").textContent = naziv;
  document.title = `${naziv} · FPL dres`;
  document.getElementById("podnaslov").textContent = `Borba za dres · ažurirano ${formatirajDatum(data.azurirano)}`;

  if (!data.igraci || data.igraci.length === 0) {
    prikaziGresku("Još nema podataka. Pokreni skriptu za preuzimanje (vidi README).");
    return;
  }

  const izracun = izracunaj(data);
  const nagrada = data.podesavanja.nagrada || "Dres";
  const delovi = [];

  if (data.demo) {
    delovi.push(el("div", { class: "traka-demo", text: "Ovo su probni podaci. Prave podatke lige učitava skripta čim se prvi put pokrene." }));
  }

  if (izracun.trenutni) {
    delovi.push(el("section", {}, [el("h2", { text: "Trenutni blok" }), kartaTrenutnogBloka(izracun.trenutni)]));
  } else {
    delovi.push(el("section", {}, [el("div", { class: "kartica", text: "Sezona je završena. Svi blokovi su podeljeni." })]));
  }

  const dresSekcija = el("section", {}, [
    el("h2", { text: `${nagrada} po blokovima` }),
    el("div", { class: "dresovi" }, izracun.blokovi.map((b) => dresKartica(b, nagrada))),
  ]);
  if (izracun.brojDresova.size > 0) {
    const poIgracu = data.igraci
      .filter((i) => izracun.brojDresova.has(i.id))
      .sort((a, b) => izracun.brojDresova.get(b.id) - izracun.brojDresova.get(a.id));
    const rekap = el("p", { class: "rekapitulacija" });
    rekap.append(document.createTextNode("Do sada: "));
    poIgracu.forEach((ig, idx) => {
      if (idx > 0) rekap.append(document.createTextNode(", "));
      rekap.append(el("b", { text: ig.ime }), document.createTextNode(` ×${izracun.brojDresova.get(ig.id)}`));
    });
    dresSekcija.append(rekap);
  }
  delovi.push(dresSekcija);

  if (data.zavrsenaKola.length > 0) {
    delovi.push(
      el("section", {}, [
        el("h2", { text: "Bodovi po kolima" }),
        tabelaPoKolima(data, izracun),
        el("p", { class: "beleska", text: "Zelena su najbolji rezultati kola, zlatna su pobednici bloka. Mali crveni broj je minus za transfere." }),
      ])
    );
  }

  delovi.push(el("section", {}, [el("h2", { text: "Pravila" }), pravila(data)]));
  koren.replaceChildren(...delovi);
}

try {
  const odgovor = await fetch("data.json", { cache: "no-cache" });
  if (!odgovor.ok) throw new Error(`HTTP ${odgovor.status}`);
  nacrtaj(await odgovor.json());
} catch (e) {
  prikaziGresku("Ne mogu da učitam data.json. Ako stranicu otvaraš direktno iz fajla, pokreni je preko lokalnog servera ili je objavi na GitHub Pages.");
  console.error(e);
}
</script>
</body>
</html>
